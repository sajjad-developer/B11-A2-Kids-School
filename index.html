<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kid's Education</title>
    <link rel="stylesheet" href="styles/style.css" />
    <script
      src="https://kit.fontawesome.com/30ab203db2.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="primary-font-quicksand" class="body-margin">
    <header>
      <!-- navbar-section start -->
      <section class="navbar-section display-flex">
        <div class="logo display-flex">
          <img class="logo-img" src="assets/logo.png" alt="" />
          <div class="logo-heading display-flex primary-font-weight">
            SCHOOL
          </div>
        </div>

        <div class="menu display-flex">
          <span><a id="menu-home" href="">Home</a></span>
          <span><a id="menu-about" href="">About</a></span>
          <span><a id="menu-facilities" href="">Facilities</a></span>
          <span><a id="menu-admission" href="">Admission</a></span>
        </div>
        <button id="menu-contact" class="display-flex">Contact</button>
        <span id="menu-icon"><i class="fa-solid fa-bars"></i></span>
      </section>
      <!-- banner-section start -->
      <section class="banner-section display-flex">
        <div class="banner-section-text">
          <div class="banner-section-heading">
            <span id="Empowering">Empowering</span> <br />
            <span id="students-from-small">students from small </span> <br />
            <span id="age">age</span>
            <span id="towards-vision">towards vision</span>
          </div>
          <p class="banner-section-description">
            With the courage, Confidence, Creativity and Compassion to make
            their Unique Contribution in a Diverse and Dynamic World.
          </p>
          <button class="enroll">Enroll now</button>
        </div>

        <img class="width-responsive-img" src="assets/hero-kids.png" alt="" />
      </section>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
